# Machine-readable inventory for the published sanitized EVE-NG .unl snapshot.
# This file documents what is actually present in the exported lab.
# It does not claim that every thesis-level technology is implemented here.

lab:
  name_in_unl: VKR2_0303_1773174064924
  reference_file: NetCore_SDN_Project.unl
  baseline_policy: unl-is-source-of-truth-for-exported-lab
  sanitized: true
  sanitization_scope:
    - embedded local usernames removed
    - password and enable-password hashes removed
    - certificates and private keys not included
    - topology and documented addressing retained

