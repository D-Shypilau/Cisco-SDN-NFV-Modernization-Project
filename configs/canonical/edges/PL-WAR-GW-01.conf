! Sanitized extract from embedded EVE-NG startup configuration
! Source: lab/eve-ng/NetCore_SDN_Project.unl, config id 7
! Secrets, AAA users and password hashes intentionally omitted.

system
 host-name PL-WAR-GW-01
 system-ip 1.1.1.5
 site-id 200
 organization-name NetCore_Solutions_2026
 vbond 192.168.1.3
!
omp
 no shutdown
 graceful-restart
 advertise connected
 advertise static
!
security
 ipsec
  integrity-type ip-udp-esp esp
 !
!
vpn 0
 interface ge0/0
  ip address 10.255.0.6/30
  ipv6 dhcp-client
  tunnel-interface
   encapsulation ipsec
   color mpls
   no allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service ospf
   no allow-service stun
   allow-service https
  !
  no shutdown
 !
 ip route 0.0.0.0/0 10.255.0.5
!
vpn 512
 interface eth0
  ip dhcp-client
  ipv6 dhcp-client
  no shutdown
 !
!
